[package]
name = "aigit"
version = "1.0.11"
description = "AI-Driven Git Tool"
authors = ["aigit"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aigit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
git2 = "0.19"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# Feature set matches actual usage (io/net/test-support/streaming/sync);
# "full" pulled in unused subsystems and inflated build time.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
    "process",
] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dirs = "6"
toml = "0.8"
atomicwrites = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
